server {
    listen       80;
    server_name  timesheet.ezeeinfo.net www.timesheet.ezeeinfo.net m.timesheet.ezeeinfo.net;
    rewrite ^    https://timesheet.ezeeinfo.net$request_uri? permanent;
    include /etc/nginx/global/letsencrypt-acme-challenge.conf;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.timesheet.ezeeinfo.net timesheet.ezeeinfo.net;


  root /usr/kimi/kimai/public;
  access_log  /var/log/nginx/portal.access.log  main;

  ssl_certificate /usr/letsencrypt/webroot/config/live/timesheet.ezeeinfo.net/fullchain.pem;
  ssl_certificate_key /usr/letsencrypt/webroot/config/live/timesheet.ezeeinfo.net/privkey.pem;

  # enable session resumption to improve https performance
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Diffie-Hellman parameter for DHE ciphersuites, recommended 2048 bits
  ssl_dhparam /etc/ssl/certs/dhparam.pem;

  # enables server-side protection from BEAST attacks
  ssl_prefer_server_ciphers on;
  # disable SSLv3(enabled by default since nginx 0.8.19) since it's less secure then TLS
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  add_header 'Referrer-Policy' 'origin';

  # ciphers chosen for forward secrecy and compatibility
  ssl_ciphers 'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS';

  # config to enable HSTS(HTTP Strict Transport Security)
  add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

  include /etc/nginx/global/php.conf;
#  include /etc/nginx/global/mobile.conf;
#  include /etc/nginx/global/cmsportal.conf;
#  include /etc/nginx/global/bitstomcat.conf;
  include /etc/nginx/global/letsencrypt-acme-challenge.conf;
  include /etc/nginx/global/restrictions.conf;

}